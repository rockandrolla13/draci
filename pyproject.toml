[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "draci"
version = "0.1.0"
description = "Doubly Robust Adaptive Conformal Inference for CATEs under temporal dependence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Andreas Koukorinis", email = "andreas.koukorinis.12@ucl.ac.uk" },
]
keywords = [
    "conformal prediction",
    "causal inference",
    "CATE",
    "treatment effects",
    "time series",
    "uncertainty quantification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]
econml = [
    "econml>=0.14",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
all = [
    "draci[ml,econml,dev]",
]

[project.urls]
Homepage = "https://github.com/rockandrolla13/draci"
Documentation = "https://github.com/rockandrolla13/draci#readme"
Repository = "https://github.com/rockandrolla13/draci"
Issues = "https://github.com/rockandrolla13/draci/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/draci"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "NPY",  # numpy-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.isort]
known-first-party = ["draci"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
